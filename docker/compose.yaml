name: lisa-lashes

networks:
  intranet:
    driver: bridge

volumes:
  pg_data:

services:
  db:
    image: postgres:16-alpine
    container_name: lisa-lashes-db
    restart: unless-stopped
    networks:
      - intranet
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/build.dockerfile
    container_name: lisa-lashes-server
    restart: unless-stopped
    networks:
      - intranet
    env_file:
      - ../secrets/.env
    environment:
      - DB_HOST=db
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy